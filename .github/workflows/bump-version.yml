name: Bump version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: Bump level
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: version-bump
  cancel-in-progress: false
  queue: max

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Validate source before generation
        env:
          SOURCE_BEFORE: ${{ github.event.before }}
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Publication requires the main workflow ref.' >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node scripts/check-source-policy.js --base "$SOURCE_BEFORE" --head "$SOURCE_HEAD"
          else
            anchor=$(node -e 'const p=require("./scripts/release-policy"); console.log(p.findReleaseAnchor(process.cwd(), "HEAD", {required:true}).commit)')
            node scripts/check-source-policy.js --base "$anchor" --head HEAD
          fi
      - name: Select candidate gate
        id: candidate
        env:
          DISPATCH_LEVEL: ${{ inputs.level }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { inspectPublication } = require('./scripts/release-policy');
          const selected = inspectPublication(process.cwd(), {
            head: 'HEAD', runId: process.env.GITHUB_RUN_ID,
            workflowSha: process.env.GITHUB_WORKFLOW_SHA,
            manualLevel: process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' ? process.env.DISPATCH_LEVEL : null,
          });
          let testCandidate;
          switch (selected.status)
          {
            case 'no eligible changes': testCandidate = true; break;
            case 'ready':
            case 'already published': testCandidate = false; break;
            default: throw new Error('Unexpected publication disposition: ' + selected.status);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `test_candidate=${testCandidate}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Source policy: passed. Publication selection: ${selected.status}.\n`);
          NODE
      - uses: actions/setup-python@v6
        if: steps.candidate.outputs.test_candidate == 'true'
        with:
          python-version: '3.12'
      - run: npm ci --include=dev
        if: steps.candidate.outputs.test_candidate == 'true'
      - run: npm run build
        if: steps.candidate.outputs.test_candidate == 'true'
      - run: node scripts/setup-tests.js
        if: steps.candidate.outputs.test_candidate == 'true'
      - run: node scripts/run-tests.js --skip-gif
        if: steps.candidate.outputs.test_candidate == 'true'
      - name: Verify tracked checkout remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Report candidate gate
        env:
          TEST_CANDIDATE: ${{ steps.candidate.outputs.test_candidate }}
        run: |
          if [ "$TEST_CANDIDATE" = true ]; then
            echo 'Development gate: completed (--skip-gif; no GIF or native macOS execution coverage).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Development gate: skipped; publication checks current main and tests any newly selected versioned distribution.' >> "$GITHUB_STEP_SUMMARY"
          fi

  bump:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Publish one validated versioned distribution
        env:
          DISPATCH_LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          # Destructive retry operations are confined to this owned runner checkout.
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = kylesaburao/harness-plugin
          test "$GITHUB_REF" = refs/heads/main
          test "$(pwd -P)" = "$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) echo '::error::Invalid workflow run ID.' >&2; exit 1 ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$DISPATCH_LEVEL" in patch|minor|major) ;; *) echo '::error::Invalid manual level.' >&2; exit 1 ;; esac
          fi
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_AUTHOR_DATE='1999-12-31T23:59:00-08:00'
          export GIT_COMMITTER_DATE='1999-12-31T23:59:00-08:00'
          transaction_dir=$(mktemp -d "$RUNNER_TEMP/harness-release.XXXXXX")
          export HARNESS_TRANSACTION_DIR="$transaction_dir"
          source_sha=unknown
          previous=unknown
          next=unknown
          level=unknown
          anchor=unknown
          release_sha=none
          attempt=0
          gates_completed=0
          outcome='failed before publication'
          report() {
            {
              echo "Result: $outcome"
              echo "Selected source: $source_sha"
              echo "Previous release: $anchor ($previous); next version: $next"
              echo "Level: $level ($GITHUB_EVENT_NAME)"
              echo 'Hosted gate: --skip-gif; no GIF or native macOS execution coverage.'
              echo "Distribution gates completed: $gates_completed"
              echo "Release SHA: $release_sha; attempt count: $attempt; run ID: $GITHUB_RUN_ID"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap report EXIT
          trap 'outcome="failed at publication step line $LINENO (status $?)"' ERR
          find_existing() {
            node - <<'NODE'
          const fs = require('node:fs');
          const policy = require('./scripts/release-policy');
          const root = process.cwd();
          const record = policy.findReleaseByRunId(root, 'origin/main', process.env.GITHUB_RUN_ID);
          if (record)
          {
            const anchor = policy.findReleaseAnchor(root, record.parent, { required: true }).commit;
            fs.writeFileSync(process.env.HARNESS_TRANSACTION_DIR + '/existing.json', JSON.stringify({ ...record, anchor }));
            console.log(record.commit);
          }
          NODE
          }
          read_field() {
            node - "${2:-$transaction_dir/selection.json}" "$1" <<'NODE'
          const fs = require('node:fs');
          const [file, field] = process.argv.slice(2);
          const record = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (typeof record[field] !== 'string')
          {
            throw new Error('Missing transaction field: ' + field);
          }
          console.log(record[field]);
          NODE
          }
          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            # Resolve a prior successful push before discarding attempt residue.
            existing=$(find_existing)
            if [ -n "$existing" ]; then
              release_sha=$existing
              next=$(read_field version "$transaction_dir/existing.json")
              previous=$(read_field previous "$transaction_dir/existing.json")
              level=$(read_field level "$transaction_dir/existing.json")
              source_sha=$(read_field parent "$transaction_dir/existing.json")
              anchor=$(read_field anchor "$transaction_dir/existing.json")
              outcome='already published'
              exit 0
            fi
            git reset --hard origin/main
            git clean -ffdx
            node - <<'NODE' > "$transaction_dir/selection.json"
          const p = require('./scripts/release-policy');
          const selected = p.inspectPublication(process.cwd(), {
            head: 'HEAD', runId: process.env.GITHUB_RUN_ID,
            workflowSha: process.env.GITHUB_WORKFLOW_SHA,
            manualLevel: process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' ? process.env.DISPATCH_LEVEL : null,
          });
          process.stdout.write(JSON.stringify(selected));
          NODE
            source_sha=$(read_field source)
            anchor=$(read_field anchor)
            previous=$(read_field previous)
            level=$(read_field level)
            if [ "$level" = none ]; then
              outcome='no eligible changes'
              next=$previous
              exit 0
            fi
            # A dependency path must not redirect installation outside this runner.
            test ! -e node_modules && test ! -L node_modules
            test -z "$(git ls-files -- node_modules)"
            npm ci --include=dev
            HARNESS_RELEASE_WRITE=1 node scripts/bump-version.js "--bump-${level}" --json > "$transaction_dir/bump.json"
            next=$(node - "$transaction_dir/bump.json" "$previous" "$level" <<'NODE'
          const fs = require('node:fs');
          const { bumpVersion } = require('./scripts/release-policy');
          const [file, previous, level] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (result.previous !== previous || result.level !== level || result.next !== bumpVersion(previous, level))
          {
            throw new Error('Bump output disagrees with the selected transaction');
          }
          console.log(result.next);
          NODE
            )
            HARNESS_RELEASE_WRITE=1 npm run build:dist
            node scripts/setup-tests.js --target distribution
            node scripts/run-tests.js --target distribution --skip-gif
            gates_completed=$((gates_completed + 1))
            npm run build:dist:check
            node scripts/validate-dist.js --target distribution
            node - "$source_sha" "$level" "$next" <<'NODE'
          const p = require('./scripts/release-policy');
          const [base, level, next] = process.argv.slice(2);
          p.validateWorkingRelease(process.cwd(), {base, level, next});
          NODE
            node - <<'NODE' > "$transaction_dir/tested.json"
          const policy = require('./scripts/release-policy');
          process.stdout.write(JSON.stringify(policy.testedInventory(process.cwd())));
          NODE
            git add -A -- src/harness/package.json dist/
            node scripts/validate-dist.js --target distribution --tracked
            node scripts/check-release.js --base "$source_sha" --level "$level" --next "$next" --staged
            node - <<'NODE'
          const fs = require('node:fs');
          const policy = require('./scripts/release-policy');
          const tested = JSON.parse(fs.readFileSync(process.env.HARNESS_TRANSACTION_DIR + '/tested.json', 'utf8'));
          policy.assertTestedInventory(process.cwd(), tested);
          NODE
            tested_tree=$(git write-tree)
            message_file="$transaction_dir/message.txt"
            printf 'chore: bump version to %s\n\nHarness-Source: %s\nHarness-Release-Run: %s\n' "$next" "$source_sha" "$GITHUB_RUN_ID" > "$message_file"
            git commit -F "$message_file"
            release_sha=$(git rev-parse HEAD)
            test "$(git rev-parse HEAD^{tree})" = "$tested_tree"
            node scripts/check-release.js --base "$source_sha" --level "$level" --next "$next" --commit "$release_sha" --run-id "$GITHUB_RUN_ID"
            push_status=0
            git push origin HEAD:refs/heads/main || push_status=$?
            if ! git fetch origin +refs/heads/main:refs/remotes/origin/main; then
              outcome="uncertain publication: remote inspection failed after push status $push_status; attempted $release_sha, run $GITHUB_RUN_ID"
              echo "::error::$outcome" >&2
              exit 1
            fi
            existing=$(find_existing)
            if [ -n "$existing" ]; then
              release_sha=$existing
              outcome=published
              exit 0
            fi
            remote_sha=$(git rev-parse origin/main)
            if [ "$remote_sha" = "$source_sha" ]; then
              outcome="push rejected without source advancement (status $push_status)"
              echo "::error::$outcome" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$source_sha" "$remote_sha"; then
              outcome='remote history changed non-fast-forward; explicit recovery required'
              echo "::error::$outcome" >&2
              exit 1
            fi
            echo "Source advanced to $remote_sha; attempt $attempt will be rebuilt and retested."
          done
          outcome='failed after three source races'
          echo "::error::$outcome" >&2
          exit 1

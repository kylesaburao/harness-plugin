name: Bump version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: Bump level
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: version-bump
  cancel-in-progress: false
  queue: max

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Validate source before generation
        env:
          SOURCE_BEFORE: ${{ github.event.before }}
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Publication requires the main workflow ref.' >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node scripts/check-source-policy.js --base "$SOURCE_BEFORE" --head "$SOURCE_HEAD"
          else
            anchor=$(node -e 'const p=require("./scripts/release-policy"); console.log(p.findReleaseAnchor(process.cwd(), "HEAD", {required:true}).commit)')
            node scripts/check-source-policy.js --base "$anchor" --head HEAD
          fi
      - name: Select candidate gate
        id: candidate
        env:
          DISPATCH_LEVEL: ${{ inputs.level }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { inspectPublication } = require('./scripts/release-policy');
          const selected = inspectPublication(process.cwd(), {
            head: 'HEAD', runId: process.env.GITHUB_RUN_ID,
            workflowSha: process.env.GITHUB_WORKFLOW_SHA,
            manualLevel: process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' ? process.env.DISPATCH_LEVEL : null,
          });
          let testCandidate;
          switch (selected.status)
          {
            case 'no eligible changes': testCandidate = true; break;
            case 'ready':
            case 'already published': testCandidate = false; break;
            default: throw new Error('Unexpected publication disposition: ' + selected.status);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `test_candidate=${testCandidate}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Source policy: passed. Publication selection: ${selected.status}.\n`);
          NODE
      - uses: actions/setup-python@v6
        if: steps.candidate.outputs.test_candidate == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Restore ASD-STE100 reference bundle
        if: steps.candidate.outputs.test_candidate == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.harness-plugin/write-asd-ste100/bundles
          key: asd-ste100-bundle-${{ runner.os }}-${{ hashFiles('src/harness/skills/write-asd-ste100/references/source-config.json') }}
      - run: npm ci --include=dev
        if: steps.candidate.outputs.test_candidate == 'true'
      - run: npm run build
        if: steps.candidate.outputs.test_candidate == 'true'
      - run: npm run test:setup
        if: steps.candidate.outputs.test_candidate == 'true'
      - run: npm test -- --skip-gif
        if: steps.candidate.outputs.test_candidate == 'true'
      - name: Verify tracked checkout remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Report candidate gate
        env:
          TEST_CANDIDATE: ${{ steps.candidate.outputs.test_candidate }}
        run: |
          if [ "$TEST_CANDIDATE" = true ]; then
            echo 'Development gate: completed (--skip-gif; no GIF or native macOS execution coverage).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Development gate: skipped; publication checks current main and tests any newly selected versioned distribution.' >> "$GITHUB_STEP_SUMMARY"
          fi

  bump:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Restore ASD-STE100 reference bundle
        uses: actions/cache@v4
        with:
          path: ~/.harness-plugin/write-asd-ste100/bundles
          key: asd-ste100-bundle-${{ runner.os }}-${{ hashFiles('src/harness/skills/write-asd-ste100/references/source-config.json') }}
      - name: Publish one validated versioned distribution
        env:
          DISPATCH_LEVEL: ${{ inputs.level }}
        run: node scripts/publish-release.js

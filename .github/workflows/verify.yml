name: Verify distribution

on: pull_request

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node scripts/setup-tests.js
      - run: node scripts/validate-dist.js --tracked
      - run: node scripts/run-tests.js --skip-gif

name: Verify source candidate

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Validate submitted source before generation
        env:
          SOURCE_BASE: ${{ github.event.pull_request.base.sha }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          INTEGRATION: ${{ github.sha }}
        run: node scripts/check-source-policy.js --base "$SOURCE_BASE" --head "$SOURCE_HEAD" --integration "$INTEGRATION"
      - name: Restore ASD-STE100 reference bundle
        uses: actions/cache@v4
        with:
          path: ~/.harness-plugin/write-asd-ste100/bundles
          key: asd-ste100-bundle-${{ runner.os }}-${{ hashFiles('src/harness/skills/write-asd-ste100/references/source-config.json') }}
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run test:setup
      - run: npm test -- --skip-gif
      - name: Verify tracked checkout remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  gif:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Name the development image as scripts/dev does
        id: image
        run: |
          key=$(printf '%s\n%s:%s\n' "$(pwd -P)" "$(id -u)" "$(id -g)" | git hash-object --stdin)
          echo "tag=harness-dev-$key:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the development image with cached layers
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: ./scripts/dev setup
      - run: ./scripts/dev exec npm test
      - name: Verify tracked checkout remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  floors:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The single declared skill runtime floor (.nvmrc, package.json engines, each skill's floor check).
        node-version: ['24.0.0']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the repository runtime for the build
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - name: Switch to the floor runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Confirm the floor runtime is active
        env:
          FLOOR: ${{ matrix.node-version }}
        run: test "$(node --version)" = "v$FLOOR"
      - run: node tests/distribution/runtime-floor.js
      - run: node tests/distribution/runtime-floor.js --backup
      - run: node tests/distribution/runtime-floor.js --wake
      - run: node tests/distribution/runtime-floor.js --gif
      - run: node tests/distribution/runtime-floor.js --frames
      - name: Verify tracked checkout remained unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
